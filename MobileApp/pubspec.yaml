name: festnet
description: FestNet attendee app — festival health & safety wearable companion (research prototype).
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.6.0 <4.0.0" # Flutter 3.27+ (Color.withValues, CardThemeData)

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  firebase_database: ^11.1.6

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.1

  # UI
  fl_chart: ^0.69.2 # C1 / C4 charts
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

  # Settings (saved theme: light / night / system)
  shared_preferences: ^2.3.3

  # Scanning the one-time claim QR code shown by event staff
  mobile_scanner: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
