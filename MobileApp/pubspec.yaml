name: festnet
description: FestNet participant / volunteer app — festival health & safety wearable companion.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  firebase_database: ^11.1.6

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.1

  # UI
  fl_chart: ^0.69.2 # C1 / C4 charts
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
